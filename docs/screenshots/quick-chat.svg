<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="-apple-system,'Segoe UI',Roboto,'Noto Sans SC',sans-serif">
  <defs>
    <clipPath id="qc"><rect x="0" y="0" width="900" height="620" rx="12"/></clipPath>
    <style>
      .t1{fill:#dbe2ec}.t2{fill:#8b96a5}.t3{fill:#5c6878}
      .acc{fill:#6d9bf5}.grn{fill:#4ec98f}.amb{fill:#e8b647}
      .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
      .s11{font-size:11px}.s12{font-size:12px}.s13{font-size:13px}.s14{font-size:14px}
      .b{font-weight:600}
    </style>
  </defs>
  <g clip-path="url(#qc)">
    <!-- dimmed app behind -->
    <rect width="900" height="620" fill="#0b0e13"/>
    <rect y="0" width="900" height="620" fill="#05070a" opacity="0.55"/>
    <g opacity="0.35">
      <rect x="16" y="20" width="180" height="580" fill="#10141b"/>
      <rect x="210" y="20" width="674" height="34" fill="#10141b"/>
      <rect x="210" y="70" width="400" height="20" rx="4" fill="#161c26"/>
      <rect x="210" y="100" width="560" height="90" rx="8" fill="#11161e"/>
    </g>

    <!-- centered modal -->
    <rect x="160" y="80" width="580" height="440" rx="12" fill="#0f1319" stroke="#232a36"/>
    <rect x="160" y="80" width="580" height="440" rx="12" fill="none" stroke="#232a36"/>
    <!-- drop shadow fake -->
    <rect x="168" y="528" width="564" height="10" rx="5" fill="#000" opacity="0.5"/>

    <!-- header -->
    <rect x="160" y="80" width="580" height="42" rx="12" fill="#0f1319"/>
    <line x1="160" y1="122" x2="740" y2="122" stroke="#1d2430"/>
    <rect x="174" y="91" width="20" height="20" rx="5" fill="#1d2430"/>
    <text x="184" y="106" text-anchor="middle" class="acc s12">✦</text>
    <text x="202" y="106" class="t1 s14 b">快速对话</text>
    <text x="274" y="106" class="t2 s12">Pi</text>
    <rect x="306" y="91" width="196" height="20" rx="10" fill="#131926" stroke="#1d2430"/>
    <text x="316" y="105" class="t3 s11 mono">scratch/20261112-0915-a1b2c3</text>
    <!-- header actions -->
    <g class="t2 s14">
      <text x="592" y="107" text-anchor="middle">＋</text>
      <text x="620" y="107" text-anchor="middle">⧉</text>
      <text x="648" y="107" text-anchor="middle">✓</text>
      <text x="676" y="107" text-anchor="middle">⛶</text>
      <text x="704" y="107" text-anchor="middle">📌</text>
      <text x="726" y="107" text-anchor="middle">×</text>
    </g>

    <!-- messages -->
    <rect x="430" y="140" width="290" height="42" rx="12" fill="#1c2b45"/>
    <text x="446" y="158" class="t1 s12">把昨天的构建日志压缩归档一下，</text>
    <text x="446" y="175" class="t1 s12">放到当前目录</text>
    <circle cx="190" cy="206" r="9" fill="#1d2430"/>
    <text x="190" y="210" text-anchor="middle" class="pur s11 b" fill="#a78bfa">P</text>
    <text x="208" y="200" class="t1 s13">已打包完成，占用从 240MB 降到 41MB：</text>
    <!-- tool card -->
    <rect x="208" y="212" width="512" height="32" rx="8" fill="#11161e" stroke="#1d2430"/>
    <text x="222" y="233" class="t3 s12">▸</text>
    <rect x="236" y="220" width="44" height="18" rx="4" fill="#1d2430"/>
    <text x="258" y="233" text-anchor="middle" class="t2 s11 mono">bash</text>
    <text x="290" y="233" class="t2 s12 mono">tar -czf build-logs-20261111.tar.gz logs/</text>
    <circle cx="700" cy="228" r="4" class="grn"/>
    <!-- file link -->
    <rect x="208" y="254" width="260" height="26" rx="6" fill="#131926"/>
    <text x="220" y="272" class="acc s12 mono">⬇ build-logs-20261111.tar.gz</text>
    <text x="208" y="304" class="t2 s12">临时目录里还留了一份，结束对话时可选择保留或删除。</text>
    <!-- streaming -->
    <text x="208" y="336" class="t1 s13">还需要我顺手清理 30 天前的旧日志吗</text>
    <rect x="466" y="326" width="8" height="14" class="acc"/>

    <!-- composer -->
    <rect x="176" y="458" width="548" height="46" rx="12" fill="#131926" stroke="#3b4a61"/>
    <rect x="188" y="470" width="9" height="20" class="acc"/>
    <text x="206" y="486" class="t3 s13">给 Pi 发消息…</text>
    <circle cx="698" cy="481" r="14" fill="#24304a"/>
    <text x="698" y="486" text-anchor="middle" class="acc s13">↑</text>

    <!-- caption -->
    <text x="450" y="580" text-anchor="middle" class="t3 s12">按 <tspan class="mono acc">Ctrl+Shift+Space</tspan> 唤出 · 自动创建临时工作目录 · 结束时归档</text>
  </g>
</svg>
